name: Publish skills
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - name: Publish and verify immutable skill packages before Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("resource.json"))["release"])')
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$tag" --notes '知办AI 官方技能资源'
          fi
          mkdir -p /tmp/published-assets
          for file in _site/packages/*.zip; do
            name=$(basename "$file")
            if gh release download "$tag" --pattern "$name" --dir /tmp/published-assets 2>/dev/null; then
              cmp "$file" "/tmp/published-assets/$name"
            else
              gh release upload "$tag" "$file"
              gh release download "$tag" --pattern "$name" --dir /tmp/published-assets
              cmp "$file" "/tmp/published-assets/$name"
            fi
          done
          gh release edit "$tag" --draft=false
          rm -rf _site/packages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
